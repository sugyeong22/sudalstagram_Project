<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

    <section layout:fragment="contents">

        <div th:each="post:${postAllList}" class="main-post d-flex justify-content-center">
            <div class="border my-2">
                <table>
                    <tbody>
                        <tr>
                            <td><i class="bi bi-person-circle"></i></td>
                            <td colspan="2"><div th:text="${post.loginId}">simsim.here</div></td>
                            <td class="d-flex justify-content-end"><button>...</button></td>
                        </tr>
                    <tr>
                        <td colspan="4">
                            <img width="500" th:src="${post.imagePath}" src="https://i.pinimg.com/736x/8a/bc/8f/8abc8f2117c2453bfcc33b48a2183612.jpg">
                        </td>
                    </tr>
                    <tr>
                        <td rowspan="2"><i class="bi bi-person-circle"></i></td>
                        <td colspan="3"><b th:text="${post.loginId}">simsim.here</b></td>
                    </tr>
                    <tr>
                        <td th:text="${post.contents}" colspan="3">인사 hehe </td>
                    </tr>
                    <tr>
                        <td>
                            <i th:if="${post.isLike}" class="bi bi-heart-fill text-danger"></i>
                            <i th:unless="${post.isLike}" class="bi bi-heart like-Btn text-danger" th:data-post-id="${post.id}"></i>
                        </td>
                        <td><b><span th:text="${post.likeCount}">23</span></b></td>
                        <td><i class="bi bi-chat"></i></td>
                        <td><b>2</b></td>
                    </tr>
                    <!-- 댓글 -->
                        <div th:each="comment:${post.commentList}">
                    <tr>
                        <td rowspan="2"><i class="bi bi-person-circle"></i></td>
                        <td colspan="3"><b><span th:text="${comment.loginId}">brrdddd</span></b></td>
                    </tr>
                    <tr>
                        <td colspan="3"><span th:text="${comment.contents}">너무 예뻐요</span></td>
                    </tr>
                        </div>
                    </tbody>
                </table>
                <div class="d-flex justify-content-center">
                    <input type="text" class="form-control col-10" th:id="|commentInput${post.id}|">
                    <button type="button" class="btn btn-secondary comment-Btn" th:data-post-id="${post.id}">입력</button>
                </div>
            </div>
        </div>

    </section>


    <script layout:fragment="script">
        $(".like-Btn").on("click", function(){
           // this 는 이벤트가 발생한 그 태그 객체이므로 각각을 의미
            let postId = $(this).data("post-id");

            $.ajax({
                type:"post"
                , url: "/post/like"
                , data:{"postId" : postId}
                , success:function(responce) {
                    if (responce.result == "success") {
                        location.reload();
                    } else {
                        alert("좋아요 실패")
                    }}
                ,error: function(){
                    alert("좋아요 에러")
                }
            })
        });

        $(".comment-Btn").on("click", function(){

            let postId = $(this).data("post-id");

            let contents = $("#commentInput" + postId).val();

            $.ajax({
                type:"post"
                , url: "/post/comment/write"
                , data:{"postId":postId, "contents":contents}
                ,success:function(response){
                    if(response.result == "success"){
                        location.reload();
                    }else{
                        alert("댓글 작성 실패")
                    }
                }
                ,error: function(){
                    alert("댓글 작성 에러")
                }
            });
        });

    </script>
