<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>회원관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="wrap" >
        <div class="d-flex justify-content-center">
            <div class="main-menu ">
                <nav>
                    <ul class="nav d-flex justify-content-between flex-column">
                        <li class="d-flex justify-content-center mt-4">
                            <div>SudalStagram</div>
                        </li>
                        <li class="nav-item d-flex justify-content-center align-items-center mt-3">
                            <i class="bi bi-house-door-fill"></i>
                            <a href="/post/timeline" class="nav-link text-dark">홈</a>
                        </li>
                        <li class="nav-item d-flex justify-content-center align-items-center">
                            <i class="bi bi-search"></i>
                            <a href="#" class="nav-link text-dark">검색</a>
                        </li>
                        <li class="nav-item d-flex justify-content-center align-items-center">
                            <i class="bi bi-plus-square"></i>
                            <a href="/post/write" class="nav-link text-dark">만들기</a>
                        </li>
                        <li class="nav-item d-flex justify-content-center align-items-center">
                            <i class="bi bi-person-fill"></i>
                            <a href="/post/mypage" class="nav-link text-dark">프로필</a>
                        </li>
                    </ul>
                    <div th:if="${session.userId != null}" class=" h-50 d-flex justify-content-center align-items-end mt-2">
                        <span th:text="${session.userName}">김땡땡</span><a href="/user/logout" class="ml-2">logOut</a>
                    </div>
                </nav>
            </div>
            <section class="main-content mb-4">
                <th:block layout:fragment="contents"></th:block>
            </section>
        </div>

        <th:block th:replace="~{fragments/footer}"></th:block>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
<th:block layout:fragment="script"></th:block>

</body>
</html>
